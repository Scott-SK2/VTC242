# Environnement local complet (N-14) : Postgres/PostGIS, Redis, API, worker, beat, web.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: vtc242
      POSTGRES_PASSWORD: vtc242
      POSTGRES_DB: vtc242
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vtc242"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory-policy noeviction --appendonly yes
    ports: ["6379:6379"]

  api:
    build: ./api
    command: sh -c "python manage.py migrate --noinput && python manage.py seed_demo && uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload"
    environment: &api_env
      DJANGO_SETTINGS_MODULE: config.settings.local
      SECRET_KEY: dev-secret-key-change-me-0123456789abcdef
      DATABASE_URL: postgis://vtc242:vtc242@db:5432/vtc242
      REDIS_URL: redis://redis:6379/0
      ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
      API_BASE_URL: http://localhost:8000
      PAYMENT_PROVIDER_MODE: sandbox
      SMS_BACKEND: console
      DEBUG_OTP_IN_RESPONSE: "1"
    volumes: ["./api:/app"]
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    build: ./api
    command: celery -A config worker -l info --concurrency 2
    environment: *api_env
    volumes: ["./api:/app"]
    depends_on: [api, redis]

  beat:
    build: ./api
    command: celery -A config beat -l info
    environment: *api_env
    volumes: ["./api:/app"]
    depends_on: [api, redis]

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8000
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    volumes: ["./web:/app"]
    ports: ["5173:5173"]
    depends_on: [api]

volumes:
  pgdata:
