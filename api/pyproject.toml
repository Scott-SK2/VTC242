[project]
name = "vtc242-api"
version = "0.1.0"
description = "VTC 242 — API Django (REST + WebSocket + workers)"
requires-python = ">=3.11"
dependencies = [
  "django>=5.1,<5.3",
  "djangorestframework>=3.15",
  "drf-spectacular>=0.27",
  "djangorestframework-simplejwt>=5.3",
  "channels>=4.1",
  "channels-redis>=4.2",
  "celery>=5.4",
  "redis>=5.0",
  "psycopg[binary]>=3.2",
  "django-environ>=0.11",
  "django-cors-headers>=4.4",
  "django-csp>=3.8",
  "django-ratelimit>=4.1",
  "argon2-cffi>=23.1",
  "django-storages[s3]>=1.14",
  "pywebpush>=2.0",
  "httpx>=0.27",
  "uvicorn[standard]>=0.30",
  "whitenoise>=6.7",
  "pyotp>=2.9",
  "sentry-sdk>=2.0",
  "prometheus-client>=0.20",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-django>=4.8",
  "pytest-cov>=5",
  "factory-boy>=3.3",
  "ruff>=0.5",
  "mypy>=1.10",
  "django-stubs[compatible-mypy]>=5.0",
  "djangorestframework-stubs>=3.15",
  "pip-audit>=2.7",
  "pytest-asyncio>=0.23",
  "daphne>=4.1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "config*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = ["B904", "DJ001"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
ignore_missing_imports = true
warn_unused_ignores = false
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["apps.payments.*", "apps.rides.*"]
check_untyped_defs = true
disallow_untyped_calls = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["apps.backoffice.*", "apps.accounts.*", "apps.drivers.*", "apps.geo.*", "apps.safety.*", "apps.realtime.*", "apps.common.*"]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q --reuse-db"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
